name: ddcs_app
description: Deepak Digital Computer Studio cross-platform service-center app.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  carousel_slider: ^5.0.0
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1
  google_maps_flutter: ^2.10.0
  url_launcher: ^6.3.1
  firebase_core: ^3.12.1
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  firebase_messaging: ^15.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
