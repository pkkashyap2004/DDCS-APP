name: Build DDCS Android App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'supabase/**'
      - '.github/workflows/android-build.yml'
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: |
          flutter create --platforms=android --org com.deepakdigitalstudio --project-name ddcs_app /tmp/ddcs_template
          cp -R /tmp/ddcs_template/android ./android
          mkdir -p assets/images
          touch assets/images/.gitkeep
      - name: Install dependencies
        run: flutter pub get
      - name: Apply safe Dart fixes
        run: dart fix --apply
      - name: Format Dart files
        run: dart format lib test
      - name: Analyze (warnings are non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings --no-pub
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - name: Upload Android release files
        uses: actions/upload-artifact@v4
        with:
          name: ddcs-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
